<style>
/* ВЫБЕЙ НОМЕР — стили (плоский тёмный интерфейс) */
:root {
  --bg: #06080f;
  --s1: #0e1220;
  --s2: #151b2e;
  --s3: #1b2238;
  --line: #222a44;
  --tx: #eef0fa;
  --mut: #7f87a8;
  --blue: #3d7bff;
  --gold: #f2b632;
  --good: #3ddc84;
  --bad: #ff6b6b;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
input, textarea { -webkit-user-select: text; user-select: text; }
html, body { margin: 0; height: 100%; background: #000; color: var(--tx); overflow: hidden; touch-action: manipulation;
  font-family: -apple-system, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Каркас ---------- */
.app {
  position: relative; width: 100%; max-width: 480px; height: 100vh; height: 100dvh; margin: 0 auto;
  display: flex; flex-direction: column; overflow: hidden; container-type: inline-size;
  background:
    radial-gradient(50% 36% at -6% 50%, rgba(24, 62, 230, .42), transparent 72%),
    radial-gradient(50% 36% at 106% 50%, rgba(24, 62, 230, .42), transparent 72%),
    var(--bg);
}
.app::before {
  content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 20%; z-index: 0; pointer-events: none;
  background: linear-gradient(135deg, rgba(30, 70, 240, .5) 0, rgba(30, 70, 240, 0) 14%);
}
#screen { flex: 1; position: relative; min-height: 0; z-index: 2; }
.view { position: absolute; inset: 0; overflow-y: auto; padding: 4px 16px 20px; -webkit-overflow-scrolling: touch; }
.view::-webkit-scrollbar { width: 0; }

/* ---------- Падающие номера на фоне ---------- */
.bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 0; transition: opacity .3s; }
.app.in-sub .bg { display: none; }
.fall { position: absolute; top: -14%; will-change: transform; animation: fall linear infinite; }
.fall .plate { font-size: inherit; }
.fall .plate, .row .plate, .cell .plate { box-shadow: none; }
.row .plate[class*="t-excl"], .cell .plate[class*="t-excl"] { box-shadow: 0 0 .9em var(--gl); }
@keyframes fall {
  from { transform: translate3d(0, 0, 0) rotate(var(--r0)); }
  to   { transform: translate3d(0, 130vh, 0) rotate(var(--r1)); }
}

/* ---------- Шапка ---------- */
.hdr { display: flex; align-items: center; gap: 10px; padding: calc(12px + max(env(safe-area-inset-top, 0px), var(--safe-area-inset-top, 0px))) 14px 8px; position: relative; z-index: 5; }
.box { background: var(--s1); border: 1px solid var(--line); }
.prof { flex: 1; min-width: 0; display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px 0 5px; border-radius: 16px; cursor: pointer; }
.av { width: 42px; height: 42px; border-radius: 12px; overflow: hidden; flex: none; background: #000; border: 1px solid var(--line); }
.av img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pinfo { min-width: 0; flex: 1; }
.pname { font-size: 15px; font-weight: 600; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.plvl { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--mut); margin-top: 3px; }
.xpbar { flex: 1; height: 6px; border-radius: 4px; background: var(--s3); overflow: hidden; min-width: 40px; }
.xpbar i { display: block; height: 100%; width: 0; border-radius: 4px; background: var(--blue); transition: width .35s ease; }
.coins { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 16px 0 10px; border-radius: 16px; font-size: 17px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.coins.pulse { animation: pulse .35s ease; }
@keyframes pulse { 40% { transform: scale(1.06); } }
.gear { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; color: #a4abc9; padding: 0; }
.gear svg { width: 26px; height: 26px; }
.gear:active, .prof:active { background: var(--s2); }

.coin { display: inline-block; flex: none; width: 1.5em; height: 1.5em; border-radius: 50%; position: relative;
  background: radial-gradient(circle at 35% 30%, #ffd56a, #f0a21c 65%, #cf8410); box-shadow: inset 0 -1px 2px rgba(120, 60, 0, .45); }
.coin::after { content: "★"; position: absolute; inset: 0; display: grid; place-items: center; font-size: .72em; color: #a85a08; }

/* ---------- Нижнее меню ---------- */
.nav { display: flex; margin: 6px 12px calc(12px + max(env(safe-area-inset-bottom, 0px), var(--safe-area-inset-bottom, 0px))); border-radius: 18px; overflow: hidden; z-index: 5; position: relative;
  background: var(--s1); border: 1px solid var(--line); }
.nav button { flex: 1; background: none; border: 0; color: #727a9c; display: flex; flex-direction: column; align-items: center; gap: 4px;
  padding: 10px 0 10px; font-size: 11.5px; position: relative; }
.nav svg { width: 25px; height: 25px; }
.nav button.on { color: #6f9bff; }
.nav button.on::after { content: ""; position: absolute; bottom: 0; left: 24%; right: 24%; height: 3px; border-radius: 3px 3px 0 0; background: var(--blue); }

/* ---------- Заголовки и поверхности ---------- */
.title { font-size: 30px; line-height: 1.15; font-weight: 700; letter-spacing: -.01em; margin: 10px 0 2px; color: #fff; }
.sub { color: var(--mut); font-size: 14.5px; margin-bottom: 14px; }
.hr { height: 1px; background: var(--line); margin: 12px 0 16px; }
.topbar { display: flex; align-items: center; gap: 12px; margin: 6px 0 6px; }
.iconbtn { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; padding: 0; color: #c9ceea; }
.iconbtn svg { width: 20px; height: 20px; }
.iconbtn:active { background: var(--s2); }
.topbar .title { margin: 0; }

.card { display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 16px; margin-bottom: 10px; background: var(--s1); border: 1px solid var(--line); }
.btn { height: 40px; padding: 0 18px; border-radius: 12px; border: 1px solid var(--line); background: var(--s2); color: var(--tx); font-weight: 600; font-size: 14.5px; white-space: nowrap; }
.btn:active { background: var(--s3); }
.btn.pri { background: var(--blue); border-color: var(--blue); color: #fff; }
.btn.pri:active { background: #2f68e6; }
.btn.dis { background: var(--s2); border-color: var(--line); color: #5d6484; }
.btn.danger { color: #ff8f8f; border-color: #5a2a33; background: #1a0f14; }
.btn.small { height: 36px; padding: 0 14px; font-size: 13.5px; }
.chip { display: inline-block; padding: 3px 9px; border-radius: 8px; font-size: 12px; font-weight: 600; white-space: nowrap;
  color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }

.seg { display: flex; padding: 3px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); margin-bottom: 14px; }
.seg button { flex: 1; height: 40px; border: 0; background: none; color: var(--mut); font-weight: 600; font-size: 15px; border-radius: 11px; }
.seg button.on { color: #fff; background: var(--s3); box-shadow: inset 0 -2px 0 var(--blue); }

.fchips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 14px; padding: 2px 16px; }
.fchips::-webkit-scrollbar { height: 0; }
.fchips button { flex: none; height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--s1); color: var(--mut); font-size: 13.5px; font-weight: 600; }
.fchips button.on { color: #fff; border-color: var(--blue); background: rgba(61, 123, 255, .16); }

/* ---------- Пустые состояния ---------- */
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; min-height: 60%; padding: 0 20px; }
.empty svg { width: 112px; height: 112px; margin-bottom: 14px; }
.et { font-size: 22px; font-weight: 700; color: #d6daf3; }
.es { font-size: 16px; color: var(--mut); margin-top: 6px; line-height: 1.35; }

/* ---------- Главная ---------- */
#v-home { overflow: hidden; padding: 0; }
.pile { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
.fly { pointer-events: none; }
.pile .plate { box-shadow: 0 .3em .6em rgba(0, 0, 0, .5); filter: none; }
.stage { position: absolute; left: 0; right: 0; top: 33%; display: flex; flex-direction: column; align-items: center; z-index: 2; }
.plate-zone { position: relative; width: 100%; padding: 56px 3%; display: flex; justify-content: center; cursor: pointer; touch-action: manipulation; }
.plate-slot { position: relative; z-index: 1; animation: float 3.6s ease-in-out infinite; }
.plate-zone .plate { font-size: min(1.85vw, 8.9px); font-size: 1.85cqw; }
.plate-zone:active .plate { transform: scale(.975); }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-4px) rotate(-2.4deg); } }
.plate.pop { animation: popin .22s cubic-bezier(.2, 1.3, .4, 1); }
@keyframes popin { from { transform: translateY(44px) scale(.72); opacity: 0; } to { transform: none; opacity: 1; } }

.aura { position: absolute; left: 50%; top: 50%; width: 112%; aspect-ratio: 3 / 1; transform: translate(-50%, -50%); border-radius: 50%; pointer-events: none; opacity: 0;
  background: radial-gradient(closest-side, var(--ac, transparent), transparent 78%); transition: opacity .4s; }
.plate-zone.r2 { --ac: rgba(61, 139, 255, .32); } .plate-zone.r2 .aura { opacity: .5; }
.plate-zone.r3 { --ac: rgba(180, 92, 255, .4); }  .plate-zone.r3 .aura { opacity: .6; }
.plate-zone.r4 { --ac: rgba(255, 197, 61, .6); }  .plate-zone.r4 .aura { opacity: 1; animation: aura 2.4s ease-in-out infinite; }
.plate-zone.r4 .plate { filter: drop-shadow(0 0 12px rgba(255, 197, 61, .7)); }
@keyframes aura { 0%, 100% { transform: translate(-50%, -50%) scale(.95); opacity: .7; } 50% { transform: translate(-50%, -50%) scale(1.12); opacity: 1; } }
.spark { position: absolute; width: 5px; height: 5px; border-radius: 50%; background: #ffe08a; box-shadow: 0 0 8px 2px #ffc53d; opacity: 0; left: var(--x); top: 62%; display: none; z-index: 2; pointer-events: none; animation: rise 2.4s ease-in infinite; animation-delay: var(--d); }
.plate-zone.r4 .spark { display: block; }
@keyframes rise { 0% { transform: translateY(0) scale(.7); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(-74px) scale(0); opacity: 0; } }
.ptxt { position: absolute; left: 50%; top: 8px; transform: translateX(-50%); font-weight: 700; font-size: 18px; color: var(--c); white-space: nowrap; pointer-events: none; z-index: 3; animation: ptxt .85s ease-out forwards; }
@keyframes ptxt { from { opacity: 1; transform: translate(-50%, 0); } to { opacity: 0; transform: translate(-50%, -30px); } }

.rar-name { margin-top: 2px; font-size: 26px; font-weight: 700; color: #cfd3f5; transition: color .2s; }
.bars { display: flex; gap: 2cqw; margin-top: 12px; }
.bars i { display: block; position: relative; width: 12cqw; height: 18px; border-radius: 9px; overflow: hidden; background: var(--s2); border: 1px solid var(--line); }
.bars b { position: absolute; inset: 0; border-radius: 9px; background: var(--c); transform: scaleX(0); transform-origin: left center; transition: transform .24s ease-out; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; min-height: 26px; padding: 0 18px; }
.tag { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; padding: 3px 9px; border-radius: 8px; color: #e8c470; background: rgba(242, 182, 50, .1); }
.tag.val { color: var(--tx); background: var(--s2); font-size: 13px; }
.tag.val .coin { font-size: 10px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 8px; min-height: 26px; padding: 0 14px; }
.bchip { font-size: 12.5px; padding: 4px 10px; border-radius: 8px; background: rgba(61, 123, 255, .16); color: #a9c4ff; }
.hint { margin-top: 10px; font-size: 14px; color: var(--mut); }

/* ---------- Строки списков ---------- */
.row { content-visibility: auto; contain-intrinsic-size: auto 150px; padding: 12px; border-radius: 16px; margin-bottom: 10px; background: var(--s1); border: 1px solid var(--line); }
.rtop { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.rtop .plate { font-size: .82cqw; flex: none; }
.rinfo { display: flex; flex-direction: column; align-items: flex-end; gap: 8px; min-width: 0; }
.pr-line { display: flex; align-items: center; gap: 7px; font-size: 18px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.pr-line .coin { font-size: 13px; }
.pr-line.no { color: var(--bad); }
.rbot { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line); }
.meta { font-size: 12.5px; color: var(--mut); line-height: 1.35; min-width: 0; }
.meta em { font-style: normal; color: #d9b45a; }
.rbot .btn { flex: none; min-width: 104px; }
.sellhead { display: flex; align-items: center; justify-content: space-between; margin: 2px 0 12px; }
.sellhead h3 { margin: 0; font-size: 19px; font-weight: 700; }
.refresh { display: flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--mut); font-size: 14px; padding: 6px 0; }
.refresh svg { width: 18px; height: 18px; }
.info { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); color: var(--mut); font-size: 13.5px; margin-top: 4px; }
.info svg { width: 20px; height: 20px; flex: none; }
.info b { color: var(--tx); font-variant-numeric: tabular-nums; margin-left: auto; }
.listing { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 14px; margin-bottom: 10px; background: rgba(61, 123, 255, .1); border: 1px solid rgba(61, 123, 255, .35); font-size: 13.5px; color: #a9c4ff; }
.listing b { margin-left: auto; color: #fff; font-variant-numeric: tabular-nums; }
.rate { font-size: 13px; font-weight: 600; margin-left: 6px; }
.rate.up { color: var(--good); } .rate.dn { color: var(--bad); }
.more { width: 100%; margin: 4px 0 10px; }

.grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.cell { content-visibility: auto; contain-intrinsic-size: auto 110px; padding: 14px 6px 10px; border-radius: 16px; text-align: center; background: var(--s1); border: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; gap: 10px; overflow: hidden; }
.cell .plate { font-size: .74cqw; }
.cell .cn { font-size: 12px; font-weight: 600; color: var(--c); }
.svc { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.svc span { font-size: 12px; padding: 4px 9px; border-radius: 8px; color: #525a7c; background: var(--s1); border: 1px solid var(--line); }
.svc span.on { color: var(--c); border-color: transparent; background: color-mix(in srgb, var(--c) 15%, transparent); }

/* ---------- Магазин ---------- */
.shop { cursor: pointer; padding: 14px; gap: 14px; }
.shop:active { background: var(--s2); }
.sic { width: 68px; height: 68px; flex: none; border-radius: 14px; display: grid; place-items: center; position: relative; background: var(--s2); }
.sic svg { width: 40px; height: 40px; }
.sic .pct { position: absolute; right: 5px; bottom: 3px; font-size: 13px; font-weight: 800; color: #aab0cf; }
.sic .pct.g { color: var(--gold); }
.sbody { flex: 1; min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: 3px; }
.sn { font-size: 18px; font-weight: 600; }
.sd { font-size: 13.5px; color: var(--mut); line-height: 1.35; }
.act { margin-top: 3px; font-size: 12.5px; color: var(--good); }
.act b { font-variant-numeric: tabular-nums; }
.sprice { display: flex; align-items: center; gap: 7px; flex: none; font-size: 16.5px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
.sprice .coin { font-size: 13px; }
.shake { animation: shake .35s; }
@keyframes shake { 20%, 60% { transform: translateX(-5px); } 40%, 80% { transform: translateX(5px); } }

/* ---------- Профиль ---------- */
.pbig { display: flex; align-items: center; gap: 18px; margin: 14px 0 22px; }
.pbig .avb { width: 104px; height: 104px; flex: none; border-radius: 26px; overflow: hidden; border: 1px solid var(--line); background: #000; }
.pbig .avb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.pbig .pn { font-size: 30px; font-weight: 700; line-height: 1.1; word-break: break-word; }
.pbig .pl { font-size: 16px; color: var(--mut); margin: 4px 0 10px; }
.pbig .xpbar { height: 8px; width: 100%; }
.pbig .xpt { text-align: right; font-size: 13px; color: var(--mut); margin-top: 5px; }
.sec { font-size: 18px; font-weight: 700; margin: 0 0 6px; }
.stats { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 12px 0; }
.stat { padding: 14px 10px; border-radius: 16px; background: var(--s1); border: 1px solid var(--line); }
.stat svg { width: 22px; height: 22px; color: #6f7aa8; }
.stat .sl { font-size: 13px; color: var(--mut); margin-top: 8px; }
.stat .sv { font-size: 22px; font-weight: 700; margin-top: 2px; }
.achrow { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 16px; background: var(--s1); border: 1px solid var(--line); cursor: pointer; font-size: 17px; font-weight: 600; }
.achrow:active { background: var(--s2); }
.achrow .tr { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; background: rgba(242, 182, 50, .12); color: var(--gold); }
.achrow .tr svg { width: 22px; height: 22px; }
.achrow .cnt { margin-left: auto; color: var(--mut); font-size: 16px; }
.achrow > svg { width: 20px; height: 20px; color: #6f7aa8; }

.ach { display: flex; gap: 12px; align-items: center; padding: 12px; border-radius: 16px; margin-bottom: 10px; background: var(--s1); border: 1px solid var(--line); }
.ach .ai { width: 42px; height: 42px; flex: none; border-radius: 12px; display: grid; place-items: center; background: var(--s2); color: #4c5373; }
.ach .ai svg { width: 24px; height: 24px; }
.ach.done .ai { background: rgba(242, 182, 50, .14); color: var(--gold); }
.ach .ab { flex: 1; min-width: 0; }
.ach .at { font-size: 15.5px; font-weight: 600; }
.ach .ad { font-size: 12.5px; color: var(--mut); margin: 1px 0 6px; line-height: 1.3; }
.ach .ap { height: 5px; border-radius: 4px; background: var(--s3); overflow: hidden; }
.ach .ap i { display: block; height: 100%; border-radius: 4px; background: var(--blue); }
.ach.done .ap i { background: var(--gold); }
.ach .ar { flex: none; display: flex; align-items: center; gap: 5px; font-size: 13.5px; font-weight: 600; color: var(--gold); }
.ach .ar .coin { font-size: 11px; }
.ach:not(.done) .ar { color: var(--mut); }

/* ---------- Тосты, модалка, загрузка ---------- */
#toasts { position: absolute; bottom: calc(96px + env(safe-area-inset-bottom)); left: 0; right: 0; display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 50; pointer-events: none; }
.toast { max-width: 92%; padding: 10px 14px; border-radius: 12px; font-size: 13.5px; background: var(--s2); border: 1px solid var(--line); border-left: 3px solid var(--blue);
  box-shadow: 0 6px 20px rgba(0, 0, 0, .5); animation: tin .22s ease, tout .3s ease 2.45s forwards; }
.toast.gold { border-left-color: var(--gold); }
.toast.err { border-left-color: var(--bad); }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }
@keyframes tout { to { opacity: 0; transform: translateY(6px); } }

.modal { position: absolute; inset: 0; z-index: 60; background: rgba(0, 0, 8, .72); display: flex; align-items: flex-end; animation: fadein .2s; }
@keyframes fadein { from { opacity: 0; } }
.sheet { width: 100%; max-height: 90%; overflow-y: auto; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); border-radius: 22px 22px 0 0;
  background: var(--s1); border: 1px solid var(--line); border-bottom: 0; animation: sheet .26s cubic-bezier(.2, .9, .3, 1); }
@keyframes sheet { from { transform: translateY(50px); opacity: 0; } }
.sh-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sh-top h2 { margin: 0; font-size: 24px; }
.set { display: flex; align-items: center; justify-content: space-between; padding: 14px 2px; border-bottom: 1px solid var(--line); font-size: 16px; }
.set.col { flex-direction: column; align-items: stretch; gap: 10px; border-bottom: 0; }
.sw { width: 50px; height: 30px; border-radius: 15px; border: 0; background: var(--s3); position: relative; padding: 0; transition: background .2s; flex: none; }
.sw::after { content: ""; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #8e96b8; transition: transform .2s, background .2s; }
.sw.on { background: var(--blue); }
.sw.on::after { transform: translateX(20px); background: #fff; }
.field { display: flex; flex-direction: column; gap: 8px; padding: 10px 2px 14px; border-bottom: 1px solid var(--line); font-size: 16px; }
input, textarea { width: 100%; padding: 12px 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: #fff; font: inherit; font-size: 16px; outline: none; }
input:focus, textarea:focus { border-color: var(--blue); }
textarea { resize: none; font-size: 13px; }
.btnrow { display: flex; gap: 10px; } .btnrow .btn { flex: 1; }
.ver { text-align: center; color: #4c5373; font-size: 12.5px; margin-top: 14px; }

.loader { position: absolute; inset: 0; z-index: 100; display: flex; flex-direction: column; align-items: center; justify-content: center; transition: opacity .6s ease;
  background: radial-gradient(60% 40% at 50% 46%, rgba(24, 62, 230, .3), transparent 70%), #000; }
.loader.out { opacity: 0; pointer-events: none; }
.ld-av { width: 46cqw; height: 46cqw; border-radius: 22%; object-fit: cover; animation: ldpop 1.1s cubic-bezier(.2, 1.3, .4, 1) both; }
.ld-title { margin-top: 22px; font-size: 20px; font-weight: 700; letter-spacing: .14em; color: #c9ceea; animation: ldfade .8s .55s both; }
@keyframes ldpop { from { transform: scale(.4) translateY(30px); opacity: 0; } 60% { opacity: 1; } to { transform: none; opacity: 1; } }
@keyframes ldfade { from { opacity: 0; transform: translateY(8px); } }


/* ---------- Новое: поиск, массовая продажа, титулы, имя ---------- */
.search { display: flex; align-items: center; gap: 10px; height: 46px; padding: 0 14px; border-radius: 14px; background: var(--s1); border: 1px solid var(--line); margin-bottom: 12px; }
.search:focus-within { border-color: var(--blue); }
.search svg { width: 20px; height: 20px; color: var(--mut); flex: none; }
.search input { border: 0; background: none; padding: 0; height: 100%; font-size: 16px; border-radius: 0; }
.search input::-webkit-search-cancel-button { -webkit-appearance: none; }
.sres { font-size: 14px; font-weight: 600; margin: 2px 2px 12px; }
.sres.ok { color: var(--good); }
.sres.no { color: var(--bad); }
.bulk { display: flex; gap: 10px; margin-bottom: 12px; }
.bulk .btn { flex: 1; padding: 0 10px; }
.exl { font-size: 14px; font-weight: 600; color: #ff8fc4; }
.rw { font-size: 12px; color: #d9b45a; margin: 0 0 6px; line-height: 1.3; }
.ach.exp { opacity: .45; }
.ach.exp .rw { color: var(--mut); }

.pnrow { display: flex; align-items: center; gap: 8px; }
.pnrow .pn { min-width: 0; flex: 0 1 auto; }
.iconbtn.sm { width: 32px; height: 32px; border-radius: 10px; flex: none; }
.iconbtn.sm svg { width: 16px; height: 16px; }
.ptitle { display: inline-flex; align-items: center; gap: 4px; margin: 8px 0 2px; padding: 5px 8px 5px 11px; border-radius: 9px; border: 0;
  font-size: 13.5px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 14%, transparent); max-width: 100%; }
.ptitle svg { width: 14px; height: 14px; flex: none; }
.trow { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 14px; border-radius: 14px; margin-top: 8px; background: var(--s2); border: 1px solid var(--line); cursor: pointer; }
.trow:active { background: var(--s3); }
.trow.cur { border-color: var(--blue); background: rgba(61, 123, 255, .12); }
.trow.lock { cursor: default; opacity: .75; }
.trow.lock:active { background: var(--s2); }
.trow .tn { font-size: 16px; font-weight: 700; }
.trow .ts { font-size: 12.5px; color: var(--mut); text-align: right; }
.trow.cur .ts { color: #a9c4ff; }

/* ---------- Номерной знак (рисуется целиком на CSS, размер = font-size) ---------- */
.plate {
  --bg1: #f3f4f8; --bg2: #c9cdd9; --fg: #0b0b12; --bd: #2c2d36; --gl: transparent;
  position: relative; display: flex; gap: .5em; width: 46em; height: 10em; padding: .55em; border-radius: 1.2em;
  background: linear-gradient(180deg, var(--bg1), var(--bg2)); border: .38em solid var(--bd); color: var(--fg);

<script>
/* ВЫБЕЙ НОМЕР — генератор номеров и оценка цены. Не зависит от DOM. */
const Logic = (function () {
  const CFG = (typeof CONFIG !== 'undefined') ? CONFIG : require('./config.js');
  const LET = CFG.letters.split('');

  const typeById = {};
  CFG.types.forEach(function (t) { typeById[t.id] = t; });

  const byRarity = CFG.rarities.map(function () { return []; });
  CFG.types.forEach(function (t) { if (!t.excl) byRarity[t.rarity].push(t); });

  const rnd = function (n) { return Math.floor(Math.random() * n); };
  const pick = function (a) { return a[rnd(a.length)]; };

  // luck — множитель шанса всех редкостей выше обычной, minR — минимальная редкость
  function rollRarity(luck, minR) {
    const w = CFG.rarities.map(function (r, i) {
      return i < minR ? 0 : r.weight * (i > 0 ? luck : 1);
    });
    const sum = w.reduce(function (a, b) { return a + b; }, 0);
    let x = Math.random() * sum;
    for (let i = 0; i < w.length; i++) {
      x -= w[i];
      if (x < 0 && w[i] > 0) return i;
    }
    return w.length - 1;
  }

  function pickType(r) {
    const list = byRarity[r];
    let sum = 0; list.forEach(function (t) { sum += t.w || 1; });
    let x = Math.random() * sum;
    for (let i = 0; i < list.length; i++) { x -= list[i].w || 1; if (x < 0) return list[i]; }
    return list[list.length - 1];
  }

  function pickRegion() {
    const x = Math.random();
    if (x < 0.20) return '77';
    if (x < 0.30) return pick(CFG.topRegions);
    return pick(CFG.regionPool);
  }

  function randDigits() {
    let d;
    do { d = '' + rnd(10) + rnd(10) + rnd(10); } while (d === '000');
    return d;
  }

  // Номер: {type, a (буква), d (3 цифры), b (2 буквы), reg}
  function genPlate(o) {
    o = o || {};
    const r = (o.forceRarity != null) ? o.forceRarity : rollRarity(o.luck || 1, o.minRarity || 0);
    const t = pickType(r);
    let a = pick(LET);
    let b = pick(LET) + pick(LET);
    let d = randDigits();

    if (Math.random() < CFG.patternChance) {
      const k = rnd(6);
      if (k === 0) {                       // три одинаковые цифры
        const x = 1 + rnd(9); d = '' + x + x + x;
      } else if (k === 1) {                // одинаковые буквы
        b = a + a;
      } else if (k === 2) {                // лесенка
        if (Math.random() < 0.5) { const s = 1 + rnd(7); d = '' + s + (s + 1) + (s + 2); }
        else { const s = 3 + rnd(7); d = '' + s + (s - 1) + (s - 2); }
      } else if (k === 3) {                // зеркало
        const x = 1 + rnd(9); let y = rnd(10); if (y === x) y = (y + 1) % 10;
        d = '' + x + y + x;
      } else if (k === 4) {                // круглые сотни
        d = (1 + rnd(9)) + '00';
      } else {                             // джекпот: тройка + одинаковые буквы
        const x = 1 + rnd(9); d = '' + x + x + x; b = a + a;
      }
    }
    return { type: t.id, a: a, d: d, b: b, reg: pickRegion() };
  }

  function rarityOf(p) { return typeById[p.type].rarity; }

  // Узоры и множитель цены
  function analyze(p) {
    const P = CFG.patterns, d = p.d, n = [+d[0], +d[1], +d[2]], f = {}, tags = [];
    let m = 1, cnt = 0;

    f.triple = (n[0] === n[1] && n[1] === n[2]);

    f.ladder = (n[1] - n[0] === 1 && n[2] - n[1] === 1) || (n[0] - n[1] === 1 && n[1] - n[2] === 1);
    f.mirror = (n[0] === n[2] && n[0] !== n[1]);

    f.s777 = d === '777';
    f.rare = (p.a + p.b).split('').filter(function (c) { return c === 'У' || c === 'Х'; }).length;

    f.regMatch = p.reg.length === 3 && p.reg === d;
    f.regIn = !f.regMatch && d.indexOf(p.reg) >= 0;

    if (f.triple) {
      m *= P.triple; cnt++; tags.push('Три одинаковые цифры');

      if (sp) { m *= sp; tags.push(f.s777 ? 'Счастливая семёрка' : f.s666 ? 'Число зверя' : 'Красивая тройка'); }

    else if (f.pair) { m *= P.pair; tags.push('Парные буквы'); }
    if (f.ladder) { m *= P.ladder; cnt++; tags.push('Лесенка'); }
    if (f.mirror) { m *= P.mirror; cnt++; tags.push('Зеркало'); }
    if (f.round) { m *= P.round; cnt++; tags.push('Круглая сотня'); }
    if (f.zeros) { m *= P.zeros; cnt++; tags.push('Нули в начале'); }

    else if (f.regIn) { m *= P.regIn; tags.push('Регион в цифрах'); }

    if (cnt >= 4) m *= P.combo4; else if (cnt >= 3) m *= P.combo3; else if (cnt >= 2) m *= P.combo2;

    return { mult: m, tags: tags, flags: f, patterns: cnt };

  function sha256(str) {

    typeById: typeById, byRarity: byRarity, rnd: rnd, pick: pick, sha256: sha256, checkCode: checkCode
  };
  return api;
})();

    if (o[k] && typeof o[k] === 'object' && !Array.isArray(o[k]) && base[k] && typeof base[k] === 'object' && !Array.isArray(base[k])) merge(base[k], o[k]);
    else base[k] = o[k];
  }
  return base;
}

let ac = null;
function audio() {
  if (!S.settings.sound) return null;
  try {
    if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
  } catch (e) { return null; }
  return ac;
}
function tone(f, d, type, vol, when, slide) {
  const a = audio(); if (!a) return;
  const t = a.currentTime + (when || 0), o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f, t);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t + d);
  g.gain.setValueAtTime(vol || .06, t);
  g.gain.exponentialRampToValueAtTime(0.0001, t + d);
  o.connect(g); g.connect(a.destination);
  o.start(t); o.stop(t + d + .03);
}

function addXp(n) {

function checkAch() {
  let again = true, guard = 0;
  const t = now();
  while (again && guard++ < 5) {

    ACH.forEach(a => {
      if (S.ach[a.id]) return;
      if (a.until && t > a.until) return;
      if (a.g(S) >= a.max) {
        S.ach[a.id] = t;
        addCoins(a.r);
        if (a.ti) grantTitle(a.ti);
        if (a.ex) grantExclusive(a.ex);
        again = true;
      }
    });
  }
}

/* ============================== Получение номеров ============================== */
function luckMult() { const n = now(); return 1 + (S.boosts.luck2 > n ? .5 : S.boosts.luck > n ? .25 : 0); }
// Номера не повторяются: тот же класс + буквы/цифры + регион выпасть дважды не может
function genUnique(opts, extra) {
  let p;
  for (let i = 0; i < 40; i++) {
    p = LG.genPlate(opts);
    const k = key(p);
    if (S.col[k] || (extra && extra[k])) continue;
    return p;
  }
  return p;
}
function offerKeys() { const o = {}; S.market.offers.forEach(x => { o[key(x.p)] = 1; }); return o; }
function nextPlate() {
  let minR = 0;
  if (S.boosts.guarantee) { minR = 2; S.boosts.guarantee = false; }
  return genUnique({ luck: luckMult(), minRarity: minR }, offerKeys());
}

function obtain(p) {
  const k = key(p), st = S.stats, r = rar(p), a = LG.value(p);
  let isNew = false;
  if (S.inv[k]) S.inv[k].n++; else S.inv[k] = { p: p, n: 1 };
  if (!S.col[k]) { S.col[k] = { p: p, t: now() }; S.stats.colCount++; isNew = true; }
  st.total++; st.byRar[r]++; st.types[p.type] = 1;
  ['triple', 'same', 'ladder', 'mirror', 'round', 'zeros', 'regMatch', 's666', 's777', 'top'].forEach(f => { if (a.flags[f]) st.flags[f] = 1; });
  if (a.mult >= 20) st.fancy++;
  if (a.mult >= 50) st.fancy2++;
  if (a.value > st.bestFind) st.bestFind = a.value;
  return { isNew: isNew, a: a, r: r };
}

let lastHit = 0;
function hit() {
  const t = performance.now();
  if (t - lastHit < 40) return;
  lastHit = t;
  if (!S.cur) S.cur = nextPlate();
  const p = S.cur, res = obtain(p);
  S.stats.clicks++;
  throwPlate();
  addXp(R[res.r].xp + (res.a.mult >= 2 ? 3 : 0));
  S.cur = nextPlate();
  showCurrent();
  feedback(p, res);
  if (S.stats.clicks >= 5) hintEl.style.display = 'none';
  checkAch(); save();
}

let lastFx = 0;
function feedback(p, res) {
  const r = res.r, tm = performance.now();
  if (r > 0 || tm - lastFx > 90) { buzz(r >= 3 ? [20, 40, 30] : r >= 1 ? 14 : 7); lastFx = tm; }
  let t = '';
  if (res.isNew && r >= 1) t = 'НОВЫЙ';
  if (r >= 2) t = (t ? t + ' · ' : '') + R[r].name;
  if (!t && res.a.mult >= 2) t = 'Красивый номер!';
  if (t) floatText(t, R[r].color);
  if (r === 4) toast('Легендарный номер: ' + ptext(p), 'gold');
}

/* ---- Номер отлетает вверх и падает в кучу ---- */
let pileZ = 1, geo = null;
const pileEls = [];
const PILE_MAX = 14;
window.addEventListener('resize', () => { geo = null; });
function getGeo(pl) {
  if (geo) return geo;
  const hr = el.home.getBoundingClientRect(), r = slot.getBoundingClientRect();
  geo = { hw: hr.width, hh: hr.height, cx: r.left + r.width / 2 - hr.left, cy: r.top + r.height / 2 - hr.top,
          w: pl.offsetWidth, h: pl.offsetHeight, fs: getComputedStyle(pl).fontSize };
  return geo;
}
let lastThrow = 0, inFlight = 0;
const FLY_MAX = 7;   // сколько номеров одновременно летит; остальные сразу ложатся в кучу
function throwPlate() {
  const pl = slot.firstElementChild;
  if (!pl) return;
  const tn = performance.now(), gap = tn - lastThrow;
  lastThrow = tn;
  const dur = Math.max(480, Math.min(860, gap * 3.4));
  const g = getGeo(pl), cx = g.cx, cy = g.cy, w = g.w, h = g.h;
  const c = pl.cloneNode(true);
  c.className = pl.className.replace('pop', '').trim() + ' fly';
  c.style.cssText = 'position:absolute;left:' + (cx - w / 2) + 'px;top:' + (cy - h / 2) + 'px;margin:0;font-size:' + g.fs + ';z-index:' + (++pileZ) + ';';

  const sc = .4;
  const yMax = cy - h / 2 - 30 - h * sc / 2;
  const yMin = g.hh * .06 + h * sc / 2;
  const heap = Math.max(10, Math.min(yMax - yMin, 26 + pileEls.length * 10));
  const ty = yMax - Math.random() * heap;
  const tx = g.hw / 2 + (Math.random() - .5) * g.hw * .46;
  const dx = tx - cx, dy = ty - cy, rot = (Math.random() - .5) * 46;
  const fin = 'translate(' + dx + 'px,' + dy + 'px) scale(' + sc + ') rotate(' + rot + 'deg)';

  pileEl.appendChild(c);
  c.style.transform = fin;
  if (c.animate && inFlight < FLY_MAX) {
    const arc = 70 + Math.random() * 30;
    inFlight++;
    const an = c.animate([
      { transform: 'translate(0,0) scale(1) rotate(-3deg)', easing: 'cubic-bezier(.22,.7,.3,1)' },
      { transform: 'translate(' + (dx * .5) + 'px,' + (dy * .5 - arc) + 'px) scale(.72) rotate(' + (rot * .4) + 'deg)', offset: .42, easing: 'cubic-bezier(.5,0,.55,1)' },
      { transform: 'translate(' + dx + 'px,' + (dy + 4) + 'px) scale(' + sc + ') rotate(' + rot + 'deg)', offset: .93, easing: 'ease-out' },
      { transform: fin }
    ], { duration: dur });
    an.onfinish = an.oncancel = () => { inFlight--; };
  }
  pileEls.push(c);
  if (pileEls.length > PILE_MAX) {
    const o = pileEls.shift();
    o.style.transition = 'opacity .4s'; o.style.opacity = '0';
    setTimeout(() => o.remove(), 450);
  }
}

function refreshMarket() {
  const m = S.market;
  m.factor = +(1 - C.market.swing + Math.random() * C.market.swing * 2).toFixed(2);
  m.refreshAt = now() + C.market.refreshMs;
  const used = {};
  m.offers = [0, 1, 2, 3, 4].map(r => {
    const p = genUnique({ forceRarity: r }, used), v = LG.value(p).value;
    used[key(p)] = 1;
    return { id: S.lid++, p: p, price: Math.max(1, Math.ceil(v * m.factor * C.market.buyMarkup)) };
  });
}
function ensureMarket() { if (!S.market.offers.length || now() >= S.market.refreshAt) refreshMarket(); }

function sellPrice(p) {
  let x = LG.value(p).value * S.market.factor * (1 - C.market.fee);
  if (S.boosts.magnet > now()) x *= 1 + C.boosts.find(b => b.id === 'magnet').mult;
  return Math.max(1, Math.floor(x));
}
function pushListing(p, price) {
  S.listings.push({ id: S.lid++, p: p, price: price, done: now() + C.market.listMin + Math.random() * (C.market.listMax - C.market.listMin) });
}
function listSell(k) {
  const it = S.inv[k]; if (!it) return;
  const p = it.p, price = sellPrice(p);
  it.n--; if (it.n <= 0) delete S.inv[k];
  pushListing(p, price);
  sfx.list(); toast('Выставлено: ' + ptext(p));
  save(); renderSub();
}
function sellBulk(filter) {
  let cnt = 0, sum = 0, best = 0;
  Object.keys(S.inv).forEach(k => {
    const it = S.inv[k];
    if (isEx(it.p) || !filter(it.p)) return;
    const price = sellPrice(it.p);
    cnt += it.n; sum += price * it.n;
    if (price > best) best = price;
    delete S.inv[k];
  });
  if (!cnt) { toast('Нечего продавать'); return; }
  addCoins(sum, true);
  S.stats.sold += cnt;
  if (best > S.stats.bestSale) S.stats.bestSale = best;
  sfx.coin(); buzz(25);
  toast('Продано номеров: ' + fmt(cnt) + ' · +' + fmt(sum) + ' монет', 'gold');
  checkAch(); save(); renderSub();
}
const isJunk = p => rar(p) === 0 && LG.value(p).mult < 2;
let armAll = 0;
function processListings() {
  const n = now(); let sum = 0, cnt = 0, last = null;
  S.listings = S.listings.filter(l => {
    if (l.done > n) return true;
    addCoins(l.price, true); S.stats.sold++;
    if (l.price > S.stats.bestSale) S.stats.bestSale = l.price;
    sum += l.price; cnt++; last = l;
    return false;
  });
  if (cnt) {
    toast(cnt === 1 ? 'Продан ' + ptext(last.p) + ' · +' + fmt(sum) : 'Продано номеров: ' + cnt + ' · +' + fmt(sum) + ' монет', 'gold');
    sfx.coin(); checkAch(); save();
  }
  return cnt > 0;
}
function buyOffer(id) {
  const m = S.market, i = m.offers.findIndex(o => o.id === id);
  if (i < 0) return;
  const o = m.offers[i];
  if (!spend(o.price)) { sfx.err(); buzz(30); toast('Не хватает монет', 'err'); return; }
  m.offers.splice(i, 1);
  obtain(o.p); S.stats.bought++;

  checkAch(); save(); renderSub();
}

    '<div class="pbig"><div class="avb"><img data-av alt=""></div><div style="flex:1;min-width:0">' +
    '<div class="pnrow"><div class="pn">' + esc(S.name) + '</div><button class="iconbtn box sm" data-act="editName" aria-label="Сменить имя">' + ICON.pencil + '</button></div>' +
    '<button class="ptitle" data-act="titles" style="--c:' + tt.color + '">' + esc(tt.name) + ICON.chevR + '</button>' +
    '<div class="pl">Уровень ' + S.level + '</div><div class="xpbar"><i style="width:' + Math.min(100, S.xp / need * 100) + '%"></i></div>' +
    '<div class="xpt">' + S.xp + ' / ' + need + ' XP</div></div></div>' +
    '<h2 class="sec">Статистика</h2><div class="hr" style="margin-top:6px"></div>' +
    '<div class="stats">' + stat(ICON.star, 'Всего номеров', fmt(st.total)) + stat(ICON.bars, 'Выиграно с рынка', fmt(st.marketEarned)) +
    stat(ICON.coins, 'Монет всего', fmt(st.coinsEarned)) + stat(ICON.clock, 'Время в игре', playTime(st.playSec)) + '</div>' +
    '<div class="achrow" data-act="ach"><span class="tr">' + ICON.trophy + '</span>Достижения<span class="cnt">' + done + ' / ' + ACH.length + '</span>' + ICON.chevR + '</div>';
}

/* ---- Достижения ---- */
function rewardLine(a) {
  const parts = [];
  if (a.ti) parts.push('титул «' + TITLE[a.ti].name + '»');
  if (a.ex) parts.push('эксклюзивный номер ' + ptext(exPlate(a.ex)));
  if (a.until) parts.push('до ' + new Date(a.until).toLocaleDateString('ru-RU'));
  return parts.length ? '<div class="rw">' + parts.join(' · ') + '</div>' : '';
}
function vAch() {
  const done = Object.keys(S.ach).length, t = now();
  let h = '<div class="topbar"><button class="iconbtn box" data-act="backProfile">' + ICON.chev + '</button><h1 class="title">Достижения</h1></div>' +
    '<div class="sub" style="margin-top:6px">Получено: ' + done + ' из ' + ACH.length + ' · титулов: ' + Object.keys(S.titles).length + '</div>';
  const rows = ACH.map(a => ({ a: a, cur: Math.min(a.max, a.g(S)), ok: !!S.ach[a.id], exp: !!(a.until && t > a.until && !S.ach[a.id]) }));
  rows.sort((x, y) => (x.ok - y.ok) || (x.exp - y.exp) || (y.cur / y.a.max - x.cur / x.a.max));
  rows.forEach(r => {
    const a = r.a;
    h += '<div class="ach' + (r.ok ? ' done' : '') + (r.exp ? ' exp' : '') + '"><div class="ai">' + ICON.trophy + '</div><div class="ab"><div class="at">' + a.t + '</div><div class="ad">' + a.d +
      (a.max > 1 ? ' · ' + (a.u ? a.u(r.cur) : fmt(r.cur) + ' / ' + fmt(a.max)) : '') + '</div>' + (r.exp ? '<div class="rw">Событие завершено</div>' : rewardLine(a)) +
      '<div class="ap"><i style="width:' + (r.cur / a.max * 100) + '%"></i></div></div>' +
      '<div class="ar">+' + fmt(a.r) + COIN + '</div></div>';
  });
  return h;
}

/* ============================== Настройки ============================== */
function openSettings() {
  const sw = k => '<button class="sw' + (S.settings[k] ? ' on' : '') + '" data-act="tg" data-v="' + k + '" aria-label="' + k + '"></button>';
  el.modal.innerHTML = '<div class="sheet"><div class="sh-top"><h2>Настройки</h2><button class="iconbtn box" data-act="close" aria-label="Закрыть">' +
    '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>' +
    '<div class="field"><span>Имя игрока</span><input id="inName" maxlength="14" value="' + esc(S.name) + '" autocomplete="off"></div>' +
    '<div class="set"><span>Звук</span>' + sw('sound') + '</div>' +
    '<div class="set"><span>Вибрация</span>' + sw('vibe') + '</div>' +
    '<div class="set"><span>Падающие номера на фоне</span>' + sw('bg') + '</div>' +
    '<div class="set col"><span>Промокод</span><div class="btnrow"><input id="inCode" placeholder="Введи код" autocomplete="off" autocapitalize="characters"><button class="btn" data-act="redeem" style="flex:none">Активировать</button></div></div>' +
    '<div class="set col"><span>Сохранение</span><textarea id="saveTa" rows="3" placeholder="Код сохранения появится здесь. Чтобы загрузить, вставь код и нажми «Импорт»."></textarea>' +
    '<div class="btnrow"><button class="btn" data-act="export">Экспорт</button><button class="btn" data-act="import">Импорт</button></div></div>' +
    '<button class="btn danger" style="width:100%" data-act="reset">Сбросить прогресс</button>' +
    '<div class="ver">Выбей номер · версия 0.2</div></div>';
  el.modal.classList.remove('hidden');
}
const closeBtn = '<button class="iconbtn box" data-act="close" aria-label="Закрыть"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>';
function openNameEditor() {
  el.modal.innerHTML = '<div class="sheet"><div class="sh-top"><h2>Имя игрока</h2>' + closeBtn + '</div>' +
    '<div class="field" style="border:0"><input id="inName2" maxlength="14" value="' + esc(S.name) + '" autocomplete="off" placeholder="Твоё имя"><span class="sub" style="margin:0;font-size:13px">До 14 символов</span></div>' +
    '<div class="btnrow"><button class="btn" data-act="close">Отмена</button><button class="btn pri" data-act="saveName">Сохранить</button></div></div>';
  el.modal.classList.remove('hidden');
  setTimeout(() => { const i = $('#inName2'); if (i) { i.focus(); i.select(); } }, 60);
}
function saveName() {
  const v = ($('#inName2').value || '').trim().slice(0, 14);
  if (!v) { toast('Имя не может быть пустым', 'err'); return; }
  S.name = v; refreshHeader(); save(); closeSettings();
  if (view === 'profile') renderSub();
}
function openTitles() {
  let h = '<div class="sheet"><div class="sh-top"><h2>Титул</h2>' + closeBtn + '</div><div class="sub">Титул виден только в твоём профиле</div>';
  C.titles.forEach(t => {
    const own = !!S.titles[t.id];
    if (!own && t.id === 'dev') return;
    const cur = S.title === t.id;
    h += '<div class="trow' + (own ? '' : ' lock') + (cur ? ' cur' : '') + '"' + (own ? ' data-act="setTitle" data-v="' + t.id + '"' : '') + '>' +
      '<span class="tn" style="color:' + (own ? t.color : '#5d6484') + '">' + esc(t.name) + '</span>' +
      '<span class="ts">' + (own ? (cur ? 'Надет' : 'Выбрать') : (titleSrc[t.id] || 'Особый')) + '</span></div>';
  });
  el.modal.innerHTML = h + '</div>';
  el.modal.classList.remove('hidden');
}
function redeem() {
  const inp = $('#inCode'), code = LG.checkCode(inp.value);
  if (!code) { sfx.err(); toast('Код не подошёл', 'err'); return; }
  if (S.redeemed[code.hash]) { toast('Этот код уже активирован'); return; }
  S.redeemed[code.hash] = 1;
  code.titles.forEach(t => grantTitle(t, true));
  code.plates.forEach(x => grantExclusive(x, true));
  if (code.titles.length) S.title = code.titles[0];
  inp.value = '';
  sfx.ach(); toast('Код активирован: ' + code.label, 'gold');
  save(); if (view === 'profile') renderSub();
}
function closeSettings() { el.modal.classList.add('hidden'); el.modal.innerHTML = ''; }
function exportSave() { return btoa(unescape(encodeURIComponent(JSON.stringify(S)))); }
function importSave(str) {
  try {
    const o = JSON.parse(decodeURIComponent(escape(atob(str.trim()))));
    if (!o || o.v !== 1 || typeof o.coins !== 'number') throw new Error('bad');
    S = merge(defState(), o); doSave(); location.reload();
  } catch (e) { toast('Код сохранения не подошёл', 'err'); }
}
let resetArmed = 0;

el.modal.addEventListener('click', e => {
  if (e.target === el.modal) { closeSettings(); return; }
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  if (a === 'close') closeSettings();
  else if (a === 'saveName') saveName();
  else if (a === 'redeem') redeem();
  else if (a === 'setTitle') { S.title = v; save(); closeSettings(); if (view === 'profile') renderSub(); }
  else if (a === 'tg') {
    S.settings[v] = !S.settings[v]; t.classList.toggle('on', S.settings[v]);
    if (v === 'bg') el.bg.style.display = S.settings.bg ? '' : 'none';
    if (v === 'sound' && S.settings.sound) sfx.buy();
    if (v === 'vibe' && S.settings.vibe) buzz(40);
    save();
  } else if (a === 'export') {
    const ta = $('#saveTa'); ta.value = exportSave(); ta.select();
    try { if (navigator.clipboard) navigator.clipboard.writeText(ta.value); } catch (er) { /* ignore */ }
    toast('Код готов. Скопируй и сохрани его');
  } else if (a === 'import') {
    const val = $('#saveTa').value; if (!val.trim()) { toast('Вставь код сохранения', 'err'); return; } importSave(val);
  } else if (a === 'reset') {
    if (now() - resetArmed < 4000) {
      resetting = true;
      try { localStorage.removeItem(C.saveKey); } catch (er) { /* ignore */ }
      location.reload();
    } else { resetArmed = now(); t.textContent = 'Точно сбросить? Нажми ещё раз'; setTimeout(() => { if (t.isConnected) t.textContent = 'Сбросить прогресс'; }, 4000); }
  }
});
el.modal.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'inName2') saveName();
  if (e.key === 'Enter' && e.target.id === 'inCode') redeem();
});
el.modal.addEventListener('input', e => {
  if (e.target.id === 'inName') { const v = e.target.value.trim().slice(0, 14); S.name = v || 'Score'; refreshHeader(); save(); }
});

/* ============================== События ============================== */
el.sub.addEventListener('click', e => {
  const t = e.target.closest('[data-act]'); if (!t) return;
  const a = t.dataset.act, v = t.dataset.v;
  switch (a) {
    case 'back': go('home'); break;
    case 'backProfile': go('profile'); break;
    case 'ach': go('ach'); break;
    case 'invF': invF = +v; invLim = 40; renderSub(); break;
    case 'colF': colF = +v; colLim = 40; renderSub(); break;
    case 'more':
      if (v === 'col') { colLim += 40; $('#colBody').innerHTML = colBody(); break; }
      if (v === 'inv') invLim += 40; else sellLim += 40;
      renderSub(); break;
    case 'editName': openNameEditor(); break;
    case 'titles': openTitles(); break;
    case 'mtab': mTab = v; renderSub(); break;
    case 'sell': listSell(v); break;
    case 'sellJunk': sellBulk(isJunk); break;
    case 'sellAll':
      if (armAll && now() - armAll < 4000) { armAll = 0; sellBulk(() => true); }
      else {
        armAll = now(); t.textContent = 'Точно продать всё? Нажми ещё раз';
        setTimeout(() => { if (armAll && now() - armAll >= 3900) { armAll = 0; if (view === 'market') renderSub(); } }, 4000);
      }
      break;
    case 'refresh': processListings(); toast('Цены актуальны'); renderSub(); break;
    case 'buy': buyOffer(+v); break;
    case 'boost': buyBoost(v); break;
  }
});
el.sub.addEventListener('input', e => {
  if (e.target.id !== 'colQ') return;
  colQ = e.target.value; colLim = 40;
  clearTimeout(colT);
  colT = setTimeout(() => { const b = $('#colBody'); if (b) b.innerHTML = colBody(); }, 120);
});
$$('#nav button').forEach(b => b.addEventListener('click', () => { audio(); go(b.dataset.go); }));
$('#btnProfile').addEventListener('click', () => go('profile'));
$('#btnSettings').addEventListener('click', openSettings);

/* ============================== Таймеры ============================== */
function mmss(s) { const m = Math.floor(s / 60), ss = s % 60; return m + ':' + (ss < 10 ? '0' : '') + ss; }
function updateTimers() {
  const n = now();
  $$('[data-until]').forEach(b => {
    const rem = Math.max(0, Math.ceil((+b.dataset.until - n) / 1000));
    b.textContent = mmss(rem);
  });
}
function tick() {
  if (!document.hidden) S.stats.playSec++;
  const sold = processListings();
  let refreshed = false;
  if (now() >= S.market.refreshAt) { refreshMarket(); refreshed = true; }
  refreshChips(); updateTimers();
  if (view === 'market' && (sold || refreshed)) renderSub();
  else if (view === 'shop' && (S.boosts.luck || S.boosts.luck2 || S.boosts.magnet)) { /* таймеры обновляются сами */ }
  if (S.stats.playSec % 30 === 0) { checkAch(); }
  if (S.stats.playSec % 20 === 0) doSave();
}

/* ============================== Запуск ============================== */
function boot() {
  $$('[data-av]').forEach(i => { i.src = AV; });
  Object.keys(S.inv).forEach(k => { if (!TY[S.inv[k].p.type]) delete S.inv[k]; });
  Object.keys(S.col).forEach(k => { if (!TY[S.col[k].p.type]) delete S.col[k]; });
  S.stats.colCount = Object.keys(S.col).length;
  Object.keys(S.exOwned).forEach(id => { if (!EX[id]) delete S.exOwned[id]; });
  Object.keys(S.titles).forEach(id => { if (!TITLE[id]) delete S.titles[id]; });
  if (!S.titles[S.title]) S.title = 'rookie';
  ACH.forEach(a => { if (S.ach[a.id]) { if (a.ti) grantTitle(a.ti, true); if (a.ex) grantExclusive(a.ex, true); } });
  ensureMarket();
  processListings();
  initHome();
  if (!S.cur) S.cur = nextPlate();
  showCurrent();
  refreshHeader();
  initBg();
  go('home');
  checkAch();
  setInterval(tick, 1000);
  setTimeout(() => {
    el.loader.classList.add('out');
    setTimeout(() => el.loader.remove(), 700);
  }, 1900);
}
boot();
})();

</script>
</body>
</html>
